<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e40af">
    <title>Inversiones A&O 0575 - Catálogo de Repuestos</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f1f5f9;
            --corporate-blue: #1e40af;
            --accent-blue: #3b82f6;
            --text-main: #0f172a;
        }
        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, #f1f5f9 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            overscroll-behavior-y: none;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .card-shadow {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .card-hover:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 10px 15px -3px rgba(30, 64, 175, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .admin-active {
            border: 2px solid #10b981 !important;
            background: #ecfdf5 !important;
        }
        .btn-tap:active { transform: scale(0.96); }
    </style>
</head>
<body class="min-h-screen pb-24 lg:pb-8 flex flex-col justify-between">

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-6">
        
        <!-- HEADER CORPORATIVO A&O CON LOGO -->
        <header class="bg-white rounded-3xl p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border border-blue-100 shadow-xl">
            <div class="flex items-center gap-4">
                <!-- CONTENEDOR DEL LOGO -->
                <div class="h-16 px-3 py-1.5 bg-blue-50/50 border border-blue-100 rounded-2xl flex items-center justify-center shadow-sm shrink-0">
                    <img src="logo.png" alt="Inversiones A&O 0575, C.A." class="h-12 w-auto object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-14 h-14 rounded-2xl bg-blue-800 flex items-center justify-center text-white shadow-lg\'><i data-lucide=\'settings\' class=\'w-8 h-8 animate-spin-slow\'></i></div>'; lucide.createIcons();">
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-blue-900 uppercase leading-none">
                        Inversiones A&O 0575, C.A
                    </h1>
                    <div class="flex flex-col mt-1">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">RIF: J-299743296-5</span>
                        <span class="text-[10px] font-bold text-blue-600 uppercase tracking-tighter flex items-center gap-1">
                            <i data-lucide="map-pin" class="w-3 h-3"></i> Maracay - Aragua
                        </span>
                    </div>
                </div>
            </div>

            <!-- BUSCADOR -->
            <div class="w-full md:w-80 relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" 
                    placeholder="Buscar repuesto, código o marca..." 
                    class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-4 py-3 text-xs text-slate-700 placeholder-slate-400 outline-none focus:border-blue-500 transition-all font-medium">
            </div>

            <!-- CONTROLES TASA Y ADMIN -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                <div class="bg-blue-50 border border-blue-100 px-3.5 py-1.5 rounded-2xl text-right flex items-center gap-2">
                    <div>
                        <div class="flex items-center gap-1.5 justify-end">
                            <span id="bcvStatus" class="bg-emerald-100 text-emerald-700 text-[8px] font-bold px-2 py-0.5 rounded-full border border-emerald-200 flex items-center gap-1">
                                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> BCV En Vivo
                            </span>
                        </div>
                        <span id="tasaDisplay" class="text-xs font-bold text-blue-900 mono">Cargando...</span>
                    </div>
                    <button id="adminSyncBtn" onclick="fetchBcvRate()" class="hidden p-1.5 text-slate-400 hover:text-blue-600 btn-tap">
                        <i data-lucide="refresh-cw" id="syncIcon" class="w-3.5 h-3.5"></i>
                    </button>
                    <button id="adminManualTasaBtn" onclick="promptManualRate()" class="hidden p-1.5 text-slate-400 hover:text-amber-600 btn-tap">
                        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                    </button>
                </div>

                <button onclick="toggleCurrency()" id="currencyBtn" class="bg-white border border-slate-200 px-3.5 py-2.5 rounded-2xl text-xs font-bold text-blue-800 btn-tap flex items-center gap-2 shadow-sm">
                    <i data-lucide="coins" class="w-4 h-4"></i>
                    <span id="currencyLabel">USD ($)</span>
                </button>

                <button id="adminManageBtn" onclick="openManageModal()" class="hidden bg-blue-700 hover:bg-blue-800 text-white p-2.5 rounded-2xl font-bold btn-tap items-center justify-center gap-1.5 shadow-lg">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i>
                    <span class="hidden sm:inline uppercase text-[10px] font-black">Inventario</span>
                </button>

                <button id="authBtn" onclick="handleAuthClick()" class="bg-slate-100 border border-slate-200 text-slate-500 hover:text-blue-700 p-2.5 rounded-2xl btn-tap transition-all">
                    <i data-lucide="lock" id="authIcon" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- CATEGORÍAS -->
        <nav class="mb-6 overflow-x-auto custom-scrollbar pb-2">
            <div class="flex items-center gap-2.5 min-w-max" id="categoryContainer"></div>
        </nav>

        <!-- GRID DE REPUESTOS -->
        <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8" id="productsGrid"></main>
    </div>

    <!-- PANEL COTIZACIÓN -->
    <div id="cartModal" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white border-l border-slate-200 z-50 transform translate-x-full transition-transform duration-300 ease-in-out p-6 flex flex-col justify-between shadow-2xl">
        <div>
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <i data-lucide="shopping-cart" class="text-blue-700 w-5 h-5"></i>
                    <h2 class="font-bold text-sm text-slate-800 uppercase tracking-wider">Mi Cotización A&O</h2>
                </div>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-red-500 p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="cartItemsList" class="mt-4 space-y-3 max-h-[60vh] overflow-y-auto custom-scrollbar pr-1"></div>
        </div>
        <div class="pt-4 border-t border-slate-100 space-y-4">
            <div class="bg-slate-50 p-4 rounded-2xl space-y-1">
                <div class="flex justify-between text-xs text-slate-500"><span>Subtotal ($):</span><span id="cartSubtotalUsd" class="font-bold text-slate-900 mono">$0.00</span></div>
                <div class="flex justify-between text-xs text-slate-500"><span>Monto en Bs:</span><span id="cartSubtotalBs" class="font-bold text-blue-700 mono">0.00 Bs</span></div>
            </div>
            <input type="text" id="clientNameInput" placeholder="Nombre o Vehículo" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500">
            <button onclick="sendWhatsAppQuote()" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-4 rounded-xl font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 btn-tap shadow-lg">
                <i data-lucide="send" class="w-4 h-4"></i> Enviar Pedido a WhatsApp
            </button>
        </div>
    </div>

    <!-- MODAL PIN -->
    <div id="pinModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl w-full max-w-xs p-6 space-y-4 shadow-2xl text-center border border-slate-100">
            <div class="h-16 w-auto flex items-center justify-center mx-auto">
                <img src="Logo Iv A&O 0575 Transparente.png" alt="Inversiones A&O 0575" class="h-14 w-auto object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center mx-auto text-blue-700\'><i data-lucide=\'shield-check\' class=\'w-6 h-6\'></i></div>'; lucide.createIcons();">
            </div>
            <h3 class="font-black text-sm text-slate-800 uppercase">Panel de Control A&O</h3>
            <input type="password" id="pinInput" maxlength="6" placeholder="******" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-center text-xl font-bold tracking-[0.5em] text-blue-700 outline-none focus:border-blue-500">
            <div class="flex gap-2">
                <button onclick="closePinModal()" class="w-1/2 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold uppercase">Cerrar</button>
                <button onclick="verifyPin()" class="w-1/2 py-2.5 bg-blue-700 text-white rounded-xl text-xs font-black uppercase btn-tap">Entrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL GESTIÓN -->
    <div id="manageProductsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-slate-100">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div class="flex gap-2">
                    <button id="tabListBtn" onclick="switchManageTab('list')" class="px-4 py-2 rounded-xl text-xs font-black uppercase bg-blue-700 text-white">Listado</button>
                    <button id="tabAddBtn" onclick="switchManageTab('add')" class="px-4 py-2 rounded-xl text-xs font-black uppercase text-slate-500 bg-white border border-slate-200">Nuevo Repuesto</button>
                </div>
                <button onclick="closeManageModal()" class="text-slate-400 hover:text-red-500"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div id="manageListTab" class="p-6 overflow-y-auto custom-scrollbar flex-1"><div id="inventoryControlList" class="space-y-2.5"></div></div>
            <div id="manageAddTab" class="p-6 overflow-y-auto custom-scrollbar hidden flex-1">
                <form onsubmit="saveNewProduct(event)" class="grid grid-cols-2 gap-4">
                    <div class="col-span-1"><label class="text-[9px] font-bold text-slate-400 uppercase">Código Parte</label><input type="text" id="newId" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none"></div>
                    <div class="col-span-1"><label class="text-[9px] font-bold text-slate-400 uppercase">Categoría</label><input type="text" id="newCategory" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none"></div>
                    <div class="col-span-2"><label class="text-[9px] font-bold text-slate-400 uppercase">Descripción del Repuesto</label><input type="text" id="newName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none"></div>
                    <div class="col-span-1"><label class="text-[9px] font-bold text-slate-400 uppercase">Marca</label><input type="text" id="newBrand" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none"></div>
                    <div class="col-span-1"><label class="text-[9px] font-bold text-slate-400 uppercase">Precio ($)</label><input type="number" step="0.01" id="newPriceUsd" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none mono"></div>
                    <div class="col-span-2"><label class="text-[9px] font-bold text-slate-400 uppercase">URL Imagen Repuesto</label><input type="url" id="newImageUrl" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none"></div>
                    <div class="col-span-2 pt-4 flex gap-2">
                        <button type="button" onclick="switchManageTab('list')" class="w-1/2 py-3 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold uppercase">Cancelar</button>
                        <button type="submit" class="w-1/2 py-3 bg-blue-700 text-white rounded-xl text-xs font-black uppercase btn-tap">Guardar en Sistema</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN MÓVIL -->
    <div class="fixed bottom-4 left-4 right-4 sm:hidden bg-white border border-slate-200 rounded-2xl p-2 flex justify-around items-center z-40 shadow-2xl">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center gap-1 text-blue-700 p-2"><i data-lucide="search" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Catálogo</span></button>
        <button onclick="toggleCart()" class="flex flex-col items-center gap-1 text-slate-400 p-2 relative"><i data-lucide="shopping-bag" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Pedido</span><span id="mobileCartBadge" class="absolute top-1 right-2 bg-blue-600 text-white font-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span></button>
    </div>

    <script>
        const MASTER_PIN = "757575";
        let isAdmin = false;
        const DEFAULT_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300' fill='%23f8fafc'><rect width='400' height='300'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%231e40af' font-family='sans-serif' font-size='16' font-weight='bold'>A%26O REPUESTOS</text></svg>";

        let productsDatabase = [
            { id: "AO-OIL-10W40", name: "Aceite Semi-Sintético 10W40 (Galón)", category: "Lubricantes", brand: "Shell", priceUsd: 32.00, imageUrl: "https://images.unsplash.com/photo-1635773054018-22c3884c03b4?w=500&q=80", active: true },
            { id: "AO-BRAKE-057", name: "Pastillas de Freno Delanteras Aveo/Optra", category: "Frenos", brand: "ACDelco", priceUsd: 18.50, imageUrl: "https://images.unsplash.com/photo-1486006396123-97753f05a0e7?w=500&q=80", active: true },
            { id: "AO-PLUG-NGK", name: "Bujía NGK G-Power (Set 4 Und)", category: "Encendido", brand: "NGK", priceUsd: 24.00, imageUrl: "https://images.unsplash.com/photo-1621939514649-280e2ee25f60?w=500&q=80", active: true }
        ];

        let TASA_BCV = 36.50;
        let activeCategory = "Todas";
        let displayCurrency = "USD";
        let cart = [];

        window.onload = () => { lucide.createIcons(); fetchBcvRate(); renderCategories(); renderProducts(); updateAdminUI(); };

        function handleAuthClick() {
            if (isAdmin) { isAdmin = false; updateAdminUI(); renderCategories(); renderProducts(); }
            else { document.getElementById('pinInput').value = ''; document.getElementById('pinModal').classList.remove('hidden'); document.getElementById('pinInput').focus(); }
        }

        function verifyPin() {
            if (document.getElementById('pinInput').value === MASTER_PIN) { isAdmin = true; document.getElementById('pinModal').classList.add('hidden'); updateAdminUI(); renderCategories(); renderProducts(); }
            else { alert("Acceso denegado."); document.getElementById('pinInput').value = ''; }
        }

        function updateAdminUI() {
            const els = ['adminManageBtn', 'adminSyncBtn', 'adminManualTasaBtn'];
            els.forEach(id => document.getElementById(id).classList.toggle('hidden', !isAdmin));
            document.getElementById('authIcon').setAttribute('data-lucide', isAdmin ? 'unlock' : 'lock');
            document.getElementById('authBtn').classList.toggle('bg-emerald-50', isAdmin);
            lucide.createIcons();
        }

        async function fetchBcvRate() {
            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                const data = await res.json();
                if(data?.promedio) {
                    TASA_BCV = parseFloat(data.promedio);
                    document.getElementById('tasaDisplay').textContent = `${TASA_BCV.toFixed(2)} Bs/$`;
                    renderProducts();
                }
            } catch(e) { console.error("Error tasa BCV"); }
        }

        function toggleCurrency() { displayCurrency = displayCurrency === "USD" ? "BS" : "USD"; document.getElementById('currencyLabel').textContent = displayCurrency === "USD" ? "USD ($)" : "Bolívares (Bs)"; renderProducts(); }

        function renderCategories() {
            const valid = isAdmin ? productsDatabase : productsDatabase.filter(p => p.active);
            const cats = ["Todas", ...new Set(valid.map(p => p.category))];
            document.getElementById('categoryContainer').innerHTML = cats.map(cat => `
                <button onclick="selectCategory('${cat}')" class="px-5 py-2.5 rounded-2xl text-xs font-bold transition-all btn-tap ${activeCategory === cat ? 'bg-blue-700 text-white' : 'bg-white text-slate-500 border border-slate-200'}">${cat}</button>
            `).join('');
        }

        function selectCategory(cat) { activeCategory = cat; renderCategories(); filterProducts(); }

        function renderProducts(db = productsDatabase) {
            const grid = document.getElementById('productsGrid');
            const filtered = (isAdmin ? db : db.filter(p => p.active)).filter(p => activeCategory === "Todas" || p.category === activeCategory);
            
            grid.innerHTML = filtered.map(p => {
                const price = displayCurrency === "USD" ? `$${p.priceUsd.toFixed(2)}` : `${(p.priceUsd * TASA_BCV).toLocaleString('es-VE')} Bs`;
                return `
                    <div class="card-shadow card-hover rounded-3xl p-4 flex flex-col justify-between transition-all group ${!p.active ? 'opacity-50 grayscale' : ''}">
                        <div>
                            <div class="relative w-full h-44 bg-slate-100 rounded-2xl overflow-hidden mb-3">
                                <img src="${p.imageUrl || DEFAULT_IMG}" onerror="this.src='${DEFAULT_IMG}'" class="w-full h-full object-cover">
                                <span class="absolute top-2 left-2 bg-white/90 text-blue-800 text-[8px] font-black uppercase px-2 py-1 rounded-lg">${p.category}</span>
                            </div>
                            <h3 class="text-sm font-bold text-slate-800 uppercase leading-tight h-10 line-clamp-2">${p.name}</h3>
                            <p class="text-[10px] text-slate-400 font-mono mt-1">CÓD: ${p.id}</p>
                        </div>
                        <div class="pt-3 mt-3 border-t border-slate-50 flex items-center justify-between">
                            <div><span class="text-base font-black text-blue-800 mono">${price}</span></div>
                            <button onclick="addToCart('${p.id}')" class="bg-blue-50 text-blue-700 p-2.5 rounded-xl btn-tap hover:bg-blue-700 hover:text-white transition-colors" ${!p.active ? 'disabled' : ''}><i data-lucide="plus" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(productsDatabase.filter(p => p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)));
        }

        function addToCart(id) {
            const p = productsDatabase.find(x => x.id === id);
            const exists = cart.find(x => x.id === id);
            if (exists) exists.qty++; else cart.push({...p, qty: 1});
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);
            document.getElementById('mobileCartBadge').textContent = totalQty;
            document.getElementById('mobileCartBadge').classList.toggle('hidden', totalQty === 0);
            
            document.getElementById('cartItemsList').innerHTML = cart.map(item => `
                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl">
                    <img src="${item.imageUrl || DEFAULT_IMG}" class="w-10 h-10 rounded-lg object-cover">
                    <div class="flex-1 min-w-0"><h4 class="text-[11px] font-bold truncate uppercase">${item.name}</h4><p class="text-[10px] text-blue-700 mono">$${(item.priceUsd * item.qty).toFixed(2)}</p></div>
                    <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg p-1">
                        <button onclick="updateQty('${item.id}', -1)" class="p-1"><i data-lucide="minus" class="w-3 h-3"></i></button>
                        <span class="text-xs font-bold mono">${item.qty}</span>
                        <button onclick="updateQty('${item.id}', 1)" class="p-1"><i data-lucide="plus" class="w-3 h-3"></i></button>
                    </div>
                </div>
            `).join('');
            
            const totalUsd = cart.reduce((a, b) => a + (b.priceUsd * b.qty), 0);
            document.getElementById('cartSubtotalUsd').textContent = `$${totalUsd.toFixed(2)}`;
            document.getElementById('cartSubtotalBs').textContent = `${(totalUsd * TASA_BCV).toLocaleString('es-VE')} Bs`;
            lucide.createIcons();
        }

        function updateQty(id, d) {
            const item = cart.find(x => x.id === id);
            item.qty += d;
            if (item.qty <= 0) cart = cart.filter(x => x.id !== id);
            updateCartUI();
        }

        function toggleCart() { document.getElementById('cartModal').classList.toggle('translate-x-full'); }
        function openManageModal() { document.getElementById('manageProductsModal').classList.remove('hidden'); renderInventoryList(); }
        function closeManageModal() { document.getElementById('manageProductsModal').classList.add('hidden'); }
        function closePinModal() { document.getElementById('pinModal').classList.add('hidden'); }

        function renderInventoryList() {
            document.getElementById('inventoryControlList').innerHTML = productsDatabase.map((p, i) => `
                <div class="flex items-center justify-between p-3 border border-slate-100 rounded-2xl ${!p.active ? 'bg-slate-50' : ''}">
                    <div class="flex items-center gap-3"><img src="${p.imageUrl || DEFAULT_IMG}" class="w-8 h-8 rounded-lg object-cover">
                    <div><h4 class="text-[10px] font-bold uppercase">${p.name}</h4><span class="text-[9px] text-slate-400 mono">${p.id} | $${p.priceUsd}</span></div></div>
                    <div class="flex gap-2">
                        <button onclick="toggleStatus(${i})" class="p-2 rounded-lg border ${p.active ? 'border-blue-200 text-blue-600' : 'border-amber-200 text-amber-600'}"><i data-lucide="${p.active?'eye':'eye-off'}" class="w-4 h-4"></i></button>
                        <button onclick="deleteProd(${i})" class="p-2 border border-red-100 text-red-500 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function toggleStatus(i) { productsDatabase[i].active = !productsDatabase[i].active; renderInventoryList(); renderProducts(); renderCategories(); }
        function deleteProd(i) { if(confirm("¿Eliminar repuesto?")) { productsDatabase.splice(i, 1); renderInventoryList(); renderProducts(); renderCategories(); } }

        function saveNewProduct(e) {
            e.preventDefault();
            productsDatabase.unshift({
                id: document.getElementById('newId').value.toUpperCase(),
                name: document.getElementById('newName').value,
                category: document.getElementById('newCategory').value,
                brand: document.getElementById('newBrand').value || "Genérico",
                priceUsd: parseFloat(document.getElementById('newPriceUsd').value),
                imageUrl: document.getElementById('newImageUrl').value,
                active: true
            });
            switchManageTab('list'); renderProducts(); renderCategories(); e.target.reset();
        }

        function switchManageTab(t) {
            document.getElementById('manageListTab').classList.toggle('hidden', t !== 'list');
            document.getElementById('manageAddTab').classList.toggle('hidden', t !== 'add');
            document.getElementById('tabListBtn').className = t === 'list' ? 'px-4 py-2 rounded-xl text-xs font-black bg-blue-700 text-white' : 'px-4 py-2 rounded-xl text-xs font-black text-slate-500 bg-white border border-slate-200';
            document.getElementById('tabAddBtn').className = t === 'add' ? 'px-4 py-2 rounded-xl text-xs font-black bg-blue-700 text-white' : 'px-4 py-2 rounded-xl text-xs font-black text-slate-500 bg-white border border-slate-200';
            if(t==='list') renderInventoryList();
        }

        function sendWhatsAppQuote() {
            if (!cart.length) return;
            const name = document.getElementById('clientNameInput').value || 'Cliente';
            let msg = `🛠️ *PEDIDO DE REPUESTOS - Inversiones A&O 0575*\n`;
            msg += `👤 *Cliente:* ${name}\n`;
            msg += `───────────────────\n`;
            cart.forEach(i => msg += `• *${i.name}* (x${i.qty}) - $${(i.priceUsd * i.qty).toFixed(2)}\n`);
            const total = cart.reduce((a, b) => a + (b.priceUsd * b.qty), 0);
            msg += `───────────────────\n💰 *TOTAL:* *$${total.toFixed(2)} USD*\n🇻🇪 *BCV:* *${(total * TASA_BCV).toLocaleString('es-VE')} Bs*\n📍 Maracay - Aragua.`;
            window.open(`https://wa.me/584144749168?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>

<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e40af">
    <title>Inversiones A&O 0575, C.A. - Catálogo Automático</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --corporate-blue: #1e40af;
            --accent-blue: #2563eb;
            --text-main: #0f172a;
        }
        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, #f8fafc 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            overscroll-behavior-y: none;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .card-shadow {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .card-hover:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 10px 20px -3px rgba(30, 64, 175, 0.12);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .btn-tap:active { transform: scale(0.96); }
    </style>
</head>
<body class="min-h-screen pb-24 lg:pb-8 flex flex-col justify-between">

    <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-6">

            <div class="flex items-center gap-4">
                <div class="h-16 px-3 py-1.5 bg-blue-50/60 border border-blue-100 rounded-2xl flex items-center justify-center shadow-sm shrink-0">
                    <img src="Logo Iv A&O 0575 Transparente.png" alt="Inversiones A&O 0575, C.A." class="h-12 w-auto object-contain" 
                         onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-12 h-12 rounded-2xl bg-blue-800 flex items-center justify-center text-white shadow-lg\'><i data-lucide=\'wrench\' class=\'w-6 h-6\'></i></div>'; lucide.createIcons();">
                </div>
                <div>

                        Inversiones A&O 0575, C.A.

                    <div class="flex flex-col mt-1">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">RIF: J-29743296-5</span>
                        <div class="flex items-center gap-3 mt-0.5">
                            <span class="text-[10px] font-bold text-blue-600 uppercase tracking-tighter flex items-center gap-1">

                            <span id="sheets-status-badge" class="text-[9px] font-black text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full flex items-center gap-1 uppercase tracking-tighter">

            <div class="w-full md:w-72 relative">

                <button onclick="fetchGoogleSheetsData()" title="Refrescar Inventario Sheets" class="bg-white border border-slate-200 p-2.5 rounded-2xl text-slate-600 hover:text-blue-800 btn-tap flex items-center gap-1 shadow-sm">

        <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8" id="productsGrid"></main>

        <div>

            <div class="space-y-2">

                <input type="text" id="clientNameInput" placeholder="Nombre de Cliente / Empresa / Vehículo" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 outline-none focus:border-blue-500 font-medium">
            </div>

            <button onclick="sendWhatsAppQuote()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2.5 btn-tap shadow-lg shadow-emerald-900/20">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="text-white"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.717-1.455L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.97C16.528 2.012 14.077.99 11.517.99c-5.44 0-9.866 4.372-9.87 9.802 0 1.689.453 3.332 1.314 4.793L1.93 20.252l4.717-1.098zm12.39-4.664c-.33-.165-1.95-.963-2.253-1.073-.3-.11-.52-.165-.74.165-.22.33-.85 1.073-1.04 1.293-.19.22-.38.24-.71.075-.33-.165-1.393-.513-2.653-1.638-.98-.874-1.64-1.953-1.83-2.282-.19-.33-.02-.508.145-.671.15-.147.33-.344.495-.516.165-.172.22-.29.33-.483.11-.19.055-.36-.03-.524-.084-.165-.74-1.785-1.015-2.45-.27-.643-.54-.555-.74-.565-.19-.01-.41-.01-.63-.01-.22 0-.58.08-.88.41-.3.33-1.155 1.127-1.155 2.748 0 1.62 1.18 3.19 1.34 3.41.165.22 2.324 3.55 5.63 4.978.787.34 1.4.543 1.88.697.79.25 1.51.215 2.08.13.634-.093 1.95-.797 2.224-1.566.275-.77.275-1.43.193-1.567-.083-.13-.3-.21-.63-.375z"/></svg>
                Enviar Pedido a WhatsApp
            </button>

    <button onclick="toggleCart()" class="hidden sm:flex fixed bottom-6 right-6 bg-blue-800 hover:bg-blue-900 text-white p-4 rounded-2xl shadow-xl shadow-blue-900/30 items-center gap-3 z-40 btn-tap font-bold text-xs uppercase tracking-wider">

        <span>Mi Pedido</span>
        <span id="desktopCartBadge" class="bg-amber-400 text-slate-950 px-2 py-0.5 rounded-lg text-xs font-black">0</span>

    <div id="toastNotify" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-blue-800 text-white font-bold text-xs px-5 py-2.5 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-[100] uppercase tracking-wider"></div>

    <div class="fixed bottom-4 left-4 right-4 sm:hidden bg-white border border-slate-200 rounded-2xl p-2 flex justify-around items-center z-40 shadow-2xl">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center gap-1 text-blue-800 p-2">
            <i data-lucide="grid" class="w-5 h-5"></i>
            <span class="text-[8px] font-bold uppercase">Catálogo</span>
        </button>
        <button onclick="toggleCart()" class="flex flex-col items-center gap-1 text-slate-500 p-2 relative">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            <span class="text-[8px] font-bold uppercase">Mi Pedido</span>
            <span id="mobileCartBadge" class="absolute top-1 right-2 bg-amber-400 text-slate-950 font-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
        </button>
    </div>

    <script>
        // 🚨 PEGA AQUÍ TU ENLACE DE GOOGLE SHEETS EN FORMATO CSV 🚨
        const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2EFMZWL0Sok8Cq8fBfQxwIlIMYycFZ-oBxOirxjEDVHKPtjv1qCToTvdfKTG9-7gnl1jDX-8NaP3w/pub?gid=0&single=true&output=csv";

        const DEFAULT_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300' fill='%23f8fafc'><rect width='400' height='300'/><text x='50%' y='45%' dominant-baseline='middle' text-anchor='middle' fill='%231e40af' font-family='sans-serif' font-size='16' font-weight='bold'>INVERSIONES A%26O 0575</text><text x='50%' y='60%' dominant-baseline='middle' text-anchor='middle' fill='%2364748b' font-family='sans-serif' font-size='12'>REPUESTOS AUTOMOTRICES</text></svg>";

        const INITIAL_PRODUCTS = [
            { id: "AO-OIL-10W40", name: "Aceite Semi-Sintético 10W40 (Galón)", category: "Lubricantes", brand: "Shell", priceUsd: 32.00, imageUrl: "https://images.unsplash.com/photo-1635773054018-22c3884c03b4?w=500&q=80", active: true },
            { id: "AO-BRAKE-057", name: "Pastillas de Freno Delanteras Aveo/Optra", category: "Frenos", brand: "ACDelco", priceUsd: 18.50, imageUrl: "https://images.unsplash.com/photo-1486006396123-97753f05a0e7?w=500&q=80", active: true },
            { id: "AO-PLUG-NGK", name: "Bujía NGK G-Power (Set 4 Und)", category: "Encendido", brand: "NGK", priceUsd: 24.00, imageUrl: "https://images.unsplash.com/photo-1621939514649-280e2ee25f60?w=500&q=80", active: true }
        ];

        let productsDatabase = [...INITIAL_PRODUCTS];
        let TASA_BCV = 36.50;
        let activeCategory = "Todas";
        let displayCurrency = "USD";
        let cart = [];

        window.onload = () => { 
            lucide.createIcons(); 
            fetchBcvRate(); 
            fetchGoogleSheetsData();
        };

        function showToast(msg) {
            const toast = document.getElementById('toastNotify');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // MOTOR DE CONEXIÓN CON GOOGLE SHEETS (CSV LECTOR)
        async function fetchGoogleSheetsData() {
            const syncIcon = document.getElementById('sheetsSyncIcon');
            const badge = document.getElementById('sheets-status-badge');
            if (syncIcon) syncIcon.classList.add('animate-spin');

            if (!GOOGLE_SHEETS_CSV_URL || GOOGLE_SHEETS_CSV_URL.includes("PEGA_AQUI")) {
                console.warn("Uso de datos por defecto. Configura la URL de tu Google Sheets.");
                if (syncIcon) syncIcon.classList.remove('animate-spin');
                renderCategories();
                renderProducts();
                return;
            }

            try {
                // Agregar timestamp para evitar que la memoria caché del navegador guarde datos viejos
                const cacheBusterUrl = `${GOOGLE_SHEETS_CSV_URL}&t=${new Date().getTime()}`;
                const response = await fetch(cacheBusterUrl);
                const csvText = await response.text();

                const parsedProducts = parseCSVToProducts(csvText);
                if (parsedProducts && parsedProducts.length > 0) {
                    productsDatabase = parsedProducts;
                    if (badge) {
                        badge.className = "text-[9px] font-black text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full flex items-center gap-1 uppercase tracking-tighter";
                        badge.innerHTML = `<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Google Sheets Activo`;
                    }
                    showToast("Inventario actualizado desde Google Sheets");
                }
            } catch (error) {
                console.error("Error leyendo Google Sheets:", error);
                if (badge) {
                    badge.className = "text-[9px] font-black text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full flex items-center gap-1 uppercase tracking-tighter";
                    badge.innerHTML = `<span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span> Inventario Local`;
                }
            }

            if (syncIcon) syncIcon.classList.remove('animate-spin');
            renderCategories();
            renderProducts();
        }

        // PARSER CSV ROBUSTO (PROCESA COMAS Y COMILLAS DE GOOGLE SHEETS)
        function parseCSVToProducts(csv) {
            const lines = csv.split(/\r\n|\n/);
            if (lines.length < 2) return null;

            const products = [];
            // Saltar la Fila 1 (Encabezados)
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // Separación respetando comillas
                const cols = line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/);
                if (cols.length < 5) continue;

                const cleanCol = (col) => col ? col.replace(/^"(.*)"$/, '$1').trim() : '';

                const sku = cleanCol(cols[0]);
                const cat = cleanCol(cols[1]);
                const name = cleanCol(cols[2]);
                const brand = cleanCol(cols[3]);
                const price = parseFloat(cleanCol(cols[4]).replace('$', '').replace(',', '.')) || 0;
                const photo = cleanCol(cols[5]);
                const estado = cleanCol(cols[6]);

                if (sku && name) {
                    const isActive = estado.toLowerCase() !== 'oculto' && estado.toLowerCase() !== 'agotado' && estado.toLowerCase() !== 'inactivo';
                    products.push({
                        id: sku,
                        category: cat || 'General',
                        name: name,
                        brand: brand || 'Genérico',
                        priceUsd: price,
                        imageUrl: photo,
                        active: isActive
                    });
                }
            }
            return products;
        }

        // CONEXIÓN TASA BCV EN VIVO
        async function fetchBcvRate() {
            const tasaEl = document.getElementById('tasaDisplay');
            const statusEl = document.getElementById('bcvStatus');
            const syncIcon = document.getElementById('syncIcon');

            if (syncIcon) syncIcon.classList.add('animate-spin');

            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                const data = await res.json();
                if(data && data.promedio) {
                    TASA_BCV = parseFloat(data.promedio);
                    tasaEl.textContent = `${TASA_BCV.toFixed(2)} Bs/$`;
                    statusEl.innerHTML = `<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> BCV En Vivo`;
                    statusEl.className = "bg-emerald-100 text-emerald-700 text-[8px] font-bold px-1.5 py-0.5 rounded-full border border-emerald-200 flex items-center gap-1";
                    renderProducts();
                    updateCartUI();
                    if (syncIcon) syncIcon.classList.remove('animate-spin');
                    return;
                }
            } catch(e) { 
                console.warn("API 1 fallo, intentando espejo..."); 
            }

            try {
                const res2 = await fetch('https://pydolarvenezuela-api.vercel.app/api/v1/dollar?page=bcv');
                const data2 = await res2.json();
                const rate = data2.monitors?.bcv?.price || data2.price;
                if(rate) {
                    TASA_BCV = parseFloat(rate);
                    tasaEl.textContent = `${TASA_BCV.toFixed(2)} Bs/$`;
                    statusEl.innerHTML = `<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> BCV En Vivo`;
                    statusEl.className = "bg-emerald-100 text-emerald-700 text-[8px] font-bold px-1.5 py-0.5 rounded-full border border-emerald-200 flex items-center gap-1";
                    renderProducts();
                    updateCartUI();
                    if (syncIcon) syncIcon.classList.remove('animate-spin');
                    return;
                }
            } catch(e) {
                console.warn("Uso de tasa de resguardo manual.");
            }

            tasaEl.textContent = `${TASA_BCV.toFixed(2)} Bs/$`;
            statusEl.innerHTML = `<span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span> BCV Manual`;
            statusEl.className = "bg-amber-100 text-amber-700 text-[8px] font-bold px-1.5 py-0.5 rounded-full border border-amber-200 flex items-center gap-1";
            if (syncIcon) syncIcon.classList.remove('animate-spin');
            renderProducts();
        }

        function toggleCurrency() { 
            displayCurrency = displayCurrency === "USD" ? "BS" : "USD"; 
            document.getElementById('currencyLabel').textContent = displayCurrency === "USD" ? "USD ($)" : "Bolívares (Bs)"; 
            renderProducts(); 
        }

        // CATEGORÍAS
        function renderCategories() {
            const valid = productsDatabase.filter(p => p.active !== false);
            const cats = ["Todas", ...new Set(valid.map(p => p.category))];
            
            if(!cats.includes(activeCategory)) activeCategory = "Todas";

            document.getElementById('categoryContainer').innerHTML = cats.map(cat => `
                <button onclick="selectCategory('${cat}')" class="px-4 py-2 rounded-2xl text-xs font-bold transition-all btn-tap ${activeCategory === cat ? 'bg-blue-800 text-white shadow-md shadow-blue-900/20' : 'bg-white text-slate-600 border border-slate-200'}">${cat}</button>
            `).join('');
        }

        function selectCategory(cat) { 
            activeCategory = cat; 
            renderCategories(); 
            filterProducts(); 
        }

        // RENDERIZAR TARJETAS EN EL CATÁLOGO
        function renderProducts(db = productsDatabase) {
            const grid = document.getElementById('productsGrid');
            const filteredByAuth = db.filter(p => p.active !== false);
            const filtered = filteredByAuth.filter(p => activeCategory === "Todas" || p.category === activeCategory);
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400">
                        <i data-lucide="package-x" class="w-12 h-12 mx-auto mb-2 opacity-30"></i>
                        <p class="text-xs font-bold uppercase tracking-wider">No se encontraron repuestos en esta categoría</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const price = displayCurrency === "USD" 
                    ? `$${p.priceUsd.toFixed(2)}` 
                    : `${(p.priceUsd * TASA_BCV).toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})} Bs`;
                
                const imgSrc = p.imageUrl && p.imageUrl.trim() !== "" ? p.imageUrl : DEFAULT_IMG;

                return `
                    <div class="card-shadow card-hover rounded-3xl p-4 flex flex-col justify-between transition-all group">
                        <div>
                            <div class="relative w-full h-44 bg-slate-100 rounded-2xl overflow-hidden mb-3 border border-slate-200">
                                <img src="${imgSrc}" onerror="this.onerror=null; this.src='${DEFAULT_IMG}'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <span class="absolute top-2 left-2 bg-white/90 text-blue-900 text-[8px] font-black uppercase px-2 py-1 rounded-lg border border-slate-200 shadow-sm">${p.category}</span>
                                <span class="absolute top-2 right-2 bg-slate-900/80 text-slate-200 text-[8px] font-bold px-2 py-1 rounded-lg mono">${p.id}</span>
                            </div>
                            <h3 class="text-xs font-bold text-slate-800 uppercase leading-snug line-clamp-2 mb-1">${p.name}</h3>
                            <p class="text-[10px] text-slate-400 font-bold uppercase">${p.brand || 'Genérico'}</p>
                        </div>
                        <div class="pt-3 mt-3 border-t border-slate-100 flex items-center justify-between">
                            <div>
                                <span class="text-[8px] font-bold text-slate-400 uppercase block">Precio</span>
                                <span class="text-sm font-black text-blue-900 mono">${price}</span>
                            </div>
                            <button onclick="addToCart('${p.id}')" class="bg-blue-50 text-blue-800 hover:bg-blue-800 hover:text-white border border-blue-200 p-2.5 rounded-xl btn-tap transition-colors">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            renderProducts(productsDatabase.filter(p => 
                p.name.toLowerCase().includes(q) || 
                p.id.toLowerCase().includes(q) ||
                p.brand.toLowerCase().includes(q) ||
                p.category.toLowerCase().includes(q)
            ));
        }

        // LÓGICA DE CARRITO
        function addToCart(id) {
            const p = productsDatabase.find(x => x.id === id);
            if (!p || p.active === false) return;

            const exists = cart.find(x => x.id === id);
            if (exists) {
                exists.qty++;
            } else {
                cart.push({ ...p, qty: 1 });
            }
            updateCartUI();
            showToast("Añadido a tu cotización");
        }

        function updateCartQty(id, delta) {
            const item = cart.find(x => x.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(x => x.id !== id);
            }
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);
            
            document.getElementById('mobileCartBadge').textContent = totalQty;
            document.getElementById('mobileCartBadge').classList.toggle('hidden', totalQty === 0);
            
            document.getElementById('desktopCartBadge').textContent = totalQty;
            document.getElementById('headerCartBadge').textContent = totalQty;

            const container = document.getElementById('cartItemsList');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-8 italic">No has seleccionado repuestos aún.</p>`;
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex items-center gap-3 bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
                        <img src="${item.imageUrl || DEFAULT_IMG}" onerror="this.src='${DEFAULT_IMG}'" class="w-10 h-10 rounded-xl object-cover border border-slate-200">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-[11px] font-bold text-slate-800 truncate uppercase">${item.name}</h4>
                            <p class="text-[10px] text-blue-800 font-mono font-bold">$${(item.priceUsd * item.qty).toFixed(2)}</p>
                        </div>
                        <div class="flex items-center gap-1.5 bg-white border border-slate-200 rounded-xl p-1">
                            <button onclick="updateCartQty('${item.id}', -1)" class="p-1 text-slate-400 hover:text-slate-800"><i data-lucide="minus" class="w-3 h-3"></i></button>
                            <span class="text-xs font-bold text-slate-800 px-1 mono">${item.qty}</span>
                            <button onclick="updateCartQty('${item.id}', 1)" class="p-1 text-slate-400 hover:text-slate-800"><i data-lucide="plus" class="w-3 h-3"></i></button>
                        </div>
                    </div>
                `).join('');
            }

            const totalUsd = cart.reduce((a, b) => a + (b.priceUsd * b.qty), 0);
            const totalBs = totalUsd * TASA_BCV;

            document.getElementById('cartSubtotalUsd').textContent = `$${totalUsd.toFixed(2)}`;
            document.getElementById('cartSubtotalBs').textContent = `${totalBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})} Bs`;
            
            lucide.createIcons();
        }

        function toggleCart() { 
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('translate-x-full'); 
        }

        // INTEGRACIÓN DIRECTA CON WHATSAPP CON RIF J-29743296-5 Y FORMAS DE PAGO OFICIALES
        function sendWhatsAppQuote() {
            if (!cart.length) {
                alert("Por favor selecciona al menos un repuesto para cotizar.");
                return;
            }

            const name = document.getElementById('clientNameInput').value.trim() || 'Cliente';
            const dateStr = new Date().toLocaleDateString('es-VE');
            
            let msg = `🛠️ *COTIZACIÓN DE REPUESTOS - Inversiones A&O 0575, C.A.*\n`;
            msg += `📋 *RIF:* J-29743296-5\n`;
            msg += `📅 *Fecha:* ${dateStr}\n`;
            msg += `👤 *Cliente:* ${name}\n`;
            msg += `───────────────────\n`;

            cart.forEach(item => {
                msg += `🔹 *${item.name}* (x${item.qty}) - $${(item.priceUsd * item.qty).toFixed(2)}\n`;
            });

            const totalUsd = cart.reduce((a, b) => a + (b.priceUsd * b.qty), 0);
            const totalBs = totalUsd * TASA_BCV;

            msg += `───────────────────\n`;
            msg += `💰 *TOTAL ESTIMADO:* *$${totalUsd.toFixed(2)} USD*\n`;
            msg += `🇻🇪 *EQUIVALENTE BCV (${TASA_BCV.toFixed(2)} Bs/$):* *${totalBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})} Bs*\n\n`;
            msg += `💳 *Formas de Pago Aceptadas:*\n`;
            msg += `✅ Pagos en Bs (Tasa BCV)\n`;
            msg += `✅ Divisa en Efectivo\n`;
            msg += `✅ Binance\n`;
            msg += `✅ Zinli\n\n`;
            msg += `📍 *Ubicación:* Maracay - Aragua.\n`;
            msg += `¡Agradecemos confirmación de disponibilidad y método de pago!`;

            const encoded = encodeURIComponent(msg);
            window.open(`https://wa.me/584144749168?text=${encoded}`, '_blank');
        }
    </script>
</body>
</html>
